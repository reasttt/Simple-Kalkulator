    <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #1a1a2e;
      font-family: 'Segoe UI', sans-serif;
    }

    .calculator {
      background: #16213e;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      width: 320px;
    }

    .display {
      background: #0f3460;
      border-radius: 12px;
      padding: 20px 16px 12px;
      margin-bottom: 20px;
      text-align: right;
      min-height: 90px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .display .expression {
      color: #a0aec0;
      font-size: 14px;
      min-height: 20px;
      margin-bottom: 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .display .current {
      color: #e2e8f0;
      font-size: 36px;
      font-weight: 300;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: 500;
      padding: 18px 0;
      cursor: pointer;
      transition: transform 0.08s, filter 0.08s;
      outline: none;
    }

    button:active {
      transform: scale(0.93);
      filter: brightness(0.85);
    }

    .btn-number {
      background: #1a365d;
      color: #e2e8f0;
    }

    .btn-number:hover {
      background: #2a4a7f;
    }

    .btn-operator {
      background: #2b6cb0;
      color: #fff;
    }

    .btn-operator:hover {
      background: #3182ce;
    }

    .btn-equals {
      background: #e53e3e;
      color: #fff;
    }

    .btn-equals:hover {
      background: #fc8181;
    }

    .btn-clear {
      background: #744210;
      color: #fefcbf;
    }

    .btn-clear:hover {
      background: #975a16;
    }

    .btn-action {
      background: #2d3748;
      color: #a0aec0;
    }

    .btn-action:hover {
      background: #4a5568;
    }

    .span-two {
      grid-column: span 2;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <div class="display">
      <div class="expression" id="expression"></div>
      <div class="current" id="current">0</div>
    </div>
    <div class="buttons">
      <button class="btn-clear"        onclick="clearAll()">AC</button>
      <button class="btn-action"       onclick="toggleSign()">+/−</button>
      <button class="btn-action"       onclick="percent()">%</button>
      <button class="btn-operator"     onclick="setOperator('/')">÷</button>

      <button class="btn-number"       onclick="appendDigit('7')">7</button>
      <button class="btn-number"       onclick="appendDigit('8')">8</button>
      <button class="btn-number"       onclick="appendDigit('9')">9</button>
      <button class="btn-operator"     onclick="setOperator('*')">×</button>

      <button class="btn-number"       onclick="appendDigit('4')">4</button>
      <button class="btn-number"       onclick="appendDigit('5')">5</button>
      <button class="btn-number"       onclick="appendDigit('6')">6</button>
      <button class="btn-operator"     onclick="setOperator('-')">−</button>

      <button class="btn-number"       onclick="appendDigit('1')">1</button>
      <button class="btn-number"       onclick="appendDigit('2')">2</button>
      <button class="btn-number"       onclick="appendDigit('3')">3</button>
      <button class="btn-operator"     onclick="setOperator('+')">+</button>

      <button class="btn-number span-two" onclick="appendDigit('0')">0</button>
      <button class="btn-number"       onclick="appendDot()">.</button>
      <button class="btn-equals"       onclick="calculate()">=</button>
    </div>
  </div>

  <script>
    let currentValue = '0';
    let previousValue = '';
    let operator = null;
    let justCalculated = false;

    const currentDisplay  = document.getElementById('current');
    const expressionDisplay = document.getElementById('expression');

    function updateDisplay() {
      currentDisplay.textContent = currentValue;
    }

    function appendDigit(digit) {
      if (justCalculated) {
        currentValue = digit;
        justCalculated = false;
      } else {
        currentValue = currentValue === '0' ? digit : currentValue + digit;
      }
      // Guard against absurdly long inputs
      if (currentValue.length > 15) return;
      updateDisplay();
    }

    function appendDot() {
      if (justCalculated) {
        currentValue = '0.';
        justCalculated = false;
        updateDisplay();
        return;
      }
      if (!currentValue.includes('.')) {
        currentValue += '.';
        updateDisplay();
      }
    }

    function setOperator(op) {
      if (operator && !justCalculated) {
        calculate(true); // chain operations
      }
      previousValue = currentValue;
      operator = op;
      justCalculated = false;

      const symbols = { '+': '+', '-': '−', '*': '×', '/': '÷' };
      expressionDisplay.textContent = `${previousValue} ${symbols[op]}`;
      currentValue = '0';
      updateDisplay();
    }

    function calculate(chaining = false) {
      if (!operator || previousValue === '') return;

      const a = parseFloat(previousValue);
      const b = parseFloat(currentValue);
      let result;

      switch (operator) {
        case '+': result = a + b; break;
        case '-': result = a - b; break;
        case '*': result = a * b; break;
        case '/':
          if (b === 0) {
            currentValue = 'Error';
            expressionDisplay.textContent = '';
            operator = null;
            previousValue = '';
            updateDisplay();
            return;
          }
          result = a / b;
          break;
      }

      // Avoid floating point noise (e.g. 0.1 + 0.2 = 0.30000000004)
      result = parseFloat(result.toPrecision(12));

      const symbols = { '+': '+', '-': '−', '*': '×', '/': '÷' };
      if (!chaining) {
        expressionDisplay.textContent = `${previousValue} ${symbols[operator]} ${currentValue} =`;
      }

      currentValue = String(result);
      operator = null;
      previousValue = '';
      justCalculated = !chaining;
      updateDisplay();
    }

    function clearAll() {
      currentValue = '0';
      previousValue = '';
      operator = null;
      justCalculated = false;
      expressionDisplay.textContent = '';
      updateDisplay();
    }

    function toggleSign() {
      if (currentValue !== '0' && currentValue !== 'Error') {
        currentValue = String(parseFloat(currentValue) * -1);
        updateDisplay();
      }
    }

    function percent() {
      if (currentValue !== 'Error') {
        currentValue = String(parseFloat(currentValue) / 100);
        updateDisplay();
      }
    }

    // Keyboard support
    document.addEventListener('keydown', (e) => {
      if (e.key >= '0' && e.key <= '9') appendDigit(e.key);
      else if (e.key === '.') appendDot();
      else if (e.key === '+') setOperator('+');
      else if (e.key === '-') setOperator('-');
      else if (e.key === '*') setOperator('*');
      else if (e.key === '/') { e.preventDefault(); setOperator('/'); }
      else if (e.key === 'Enter' || e.key === '=') calculate();
      else if (e.key === 'Escape') clearAll();
      else if (e.key === 'Backspace') {
        if (currentValue.length > 1 && currentValue !== 'Error') {
          currentValue = currentValue.slice(0, -1);
        } else {
          currentValue = '0';
        }
        updateDisplay();
      }
    });
  </script>
</body>
</html>
